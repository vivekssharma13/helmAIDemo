version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: helmai-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/chromadb-data:/data
    environment:
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  helmai-network:
    driver: bridge

volumes:
  chromadb-data:
    driver: local
